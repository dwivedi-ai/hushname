# Typical yearly prices (USD) at budget registrars such as Porkbun, Dynadot
# and Namecheap. Used only for the "in budget" estimate. When registrar
# verification is on, the real quoted price replaces these numbers.
#
# Renewal is what matters for a portfolio: a $3 first year that renews at
# $55 is not cheap. min_years is the shortest term the registry sells.
#
# Last reviewed: 2026-10. PRs updating prices are welcome.

