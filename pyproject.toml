[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hushname"
version = "0.2.0"
description = "Find unregistered high-value domain names, safely (registry RDAP + optional registrar verification)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["domains", "rdap", "whois", "domain-availability", "domaining"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]

[project.scripts]
hushname = "hushname.cli:main"

[tool.setuptools]
packages = ["hushname"]

[tool.setuptools.package-data]
hushname = ["data/*"]
